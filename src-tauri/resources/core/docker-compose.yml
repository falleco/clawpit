services:
  
  ################
  # Egress Proxy #
  ################
  clawpit-egress:
    image: falleco/egress:latest
    container_name: clawpit-egress
    expose:
      - "3128"
    volumes:
      - ./egress/allowed-domains.txt:/etc/squid/allowed-domains.txt:ro
      - ./egress/allowed-ips.txt:/etc/squid/allowed-ips.txt:ro
    networks:
      - clawpit-internal
      - clawpit-egress
    read_only: true
    dns:
      - 1.1.1.1
      - 8.8.8.8
    tmpfs:
      - /tmp
      - /var/cache/squid
      - /var/log/squid
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped


################
#   Networks   #
################
networks:
  clawpit-internal:
    internal: true
  clawpit-egress:
